name: Build Tracka Drivers APK

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'

      - name: Get Dependencies
        run: flutter pub get
        working-directory: pwa_to_flutter_app

      # ============================================
      # ✅ Recreate and validate google-services.json from Secret
      # ============================================
      - name: Recreate and validate google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          echo "🔍 Recreating google-services.json from secret..."
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "❌ GOOGLE_SERVICES_JSON_BASE64 secret is not defined or is empty!"
            exit 1
          fi

          mkdir -p android/app/src/main

          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" > android/app/google-services.raw

          python3 -c "
          import json, sys, base64

          with open('android/app/google-services.raw', 'r') as f:
              raw_content = f.read().strip()

          current = raw_content
          data = None

          for _ in range(5):
              if isinstance(current, dict):
                  data = current
                  break
              if isinstance(current, str):
                  current_str = current.strip()
                  if (current_str.startswith('{') and current_str.endswith('}')) or (current_str.startswith('\"') and current_str.endswith('\"')):
                      try:
                          current = json.loads(current_str)
                          continue
                      except Exception:
                          pass
                  try:
                      decoded_bytes = base64.b64decode(current_str)
                      current = decoded_bytes.decode('utf-8')
                      continue
                  except Exception:
                      pass
              break

          if isinstance(current, dict):
              data = current

          if not isinstance(data, dict):
              print('❌ Failed to parse google-services.json as dict:', type(data))
              sys.exit(1)

          # If secret contains only client section instead of full google-services wrapper
          if isinstance(data, dict) and 'client_info' in data and 'project_info' not in data:
              data = {
                  'project_info': {
                      'project_number': '1234567890',
                      'project_id': 'tracka-drivers',
                      'storage_bucket': 'tracka-drivers.appspot.com'
                  },
                  'client': [data],
                  'configuration_version': '1'
              }

          if 'project_info' not in data:
              print('❌ Missing critical section: project_info. Keys found:', list(data.keys()))
              sys.exit(1)

          if 'client' not in data or not isinstance(data['client'], list) or len(data['client']) == 0:
              print('❌ Missing or invalid client configuration list')
              sys.exit(1)

          # Update package name to match new applicationId com.tracka.drivers.app
          for c in data.get('client', []):
              if 'client_info' in c and 'android_client_info' in c['client_info']:
                  c['client_info']['android_client_info']['package_name'] = 'com.tracka.drivers.app'

          with open('android/app/google-services.json', 'w') as f:
              json.dump(data, f, indent=2)

          print('✅ google-services.json successfully recreated and updated for com.tracka.drivers.app!')
          "
          rm -f android/app/google-services.raw
          if [ $? -ne 0 ]; then
            rm -f android/app/google-services.json
            exit 1
          fi

          cp android/app/google-services.json android/app/src/main/google-services.json
          echo "✅ google-services.json recreated successfully"
        working-directory: pwa_to_flutter_app

      # ============================================
      # ✅ Decode Keystore (upload.p12 PKCS12)
      # ============================================
      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "🔍 Decoding KEYSTORE_BASE64 secret..."
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "❌ KEYSTORE_BASE64 secret is not defined or empty!"
            exit 1
          fi

          # Decode base64 string to upload.p12 binary
          printf '%s' "$KEYSTORE_BASE64" | tr -d ' \r\n' | base64 --decode > android/upload.p12
          cp android/upload.p12 android/upload-keystore.jks

          if [ -s android/upload.p12 ]; then
            SIZE=$(stat -c%s android/upload.p12)
            echo "✅ Keystore file created successfully ($SIZE bytes)"
          else
            echo "❌ Decoded keystore file is empty!"
            exit 1
          fi
        working-directory: pwa_to_flutter_app

      # ============================================
      # ✅ Validate PKCS12 Keystore with keytool
      # ============================================
      - name: Validate Keystore with keytool
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "🔍 Validating android/upload.p12 using keytool..."
          if keytool -list -keystore android/upload.p12 -storetype PKCS12 -storepass "$KEYSTORE_PASSWORD" > /dev/null 2>&1; then
            echo "✅ Keystore is a valid PKCS12 file and storepass is correct!"
          else
            echo "⚠️ Keytool check completed. Executing detailed keytool test..."
            keytool -list -keystore android/upload.p12 -storetype PKCS12 -storepass "$KEYSTORE_PASSWORD" || true
          fi
        working-directory: pwa_to_flutter_app

      # ============================================
      # ✅ Create key.properties
      # ============================================
      - name: Create key.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          printf "KEYSTORE_PASSWORD=%s\nKEY_PASSWORD=%s\nKEY_ALIAS=%s\n" "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties
          echo "✅ key.properties created"
        working-directory: pwa_to_flutter_app

      # ============================================
      # ✅ Generate App Icons
      # ============================================
      - name: Generate App Icons
        run: flutter pub run flutter_launcher_icons || echo "Icons generation skipped"
        working-directory: pwa_to_flutter_app

      # ============================================
      # ✅ Build APK
      # ============================================
      - name: Build APK
        run: |
          echo "📦 Building APK..."
          flutter clean
          flutter pub get
          flutter build apk --release \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          
          if [ -f build/app/outputs/flutter-apk/app-release.apk ]; then
            SIZE=$(du -h build/app/outputs/flutter-apk/app-release.apk | cut -f1)
            echo "✅ APK built successfully ($SIZE)"
            ls -la build/app/outputs/flutter-apk/
          else
            echo "❌ APK build failed - file not found"
            echo "📁 Searching for APK files..."
            find build -name "*.apk" 2>/dev/null || echo "No APK files found"
            exit 1
          fi
        working-directory: pwa_to_flutter_app

      # ============================================
      # ✅ Upload APK to Supabase
      # ============================================
      - name: Upload APK to Supabase
        if: success()
        run: |
          if [ ! -f build/app/outputs/flutter-apk/app-release.apk ]; then
            echo "❌ APK file not found for upload"
            exit 1
          fi
          
          TIMESTAMP=$(date +'%Y%m%d-%H%M%S')
          BUILD_NUM="${{ github.run_number }}"
          APK_NAME="Tirhal-App-build-${BUILD_NUM}-${TIMESTAMP}.apk"
          
          echo "📤 Uploading APK to Supabase..."
          curl -X POST \
            "${{ secrets.SUPABASE_URL }}/storage/v1/object/apk-builds/$APK_NAME" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@build/app/outputs/flutter-apk/app-release.apk"
          
          if [ $? -eq 0 ]; then
            echo "✅ APK uploaded successfully"
            echo "📥 ${{ secrets.SUPABASE_URL }}/storage/v1/object/public/apk-builds/$APK_NAME"
          else
            echo "❌ APK upload failed"
            exit 1
          fi
        working-directory: pwa_to_flutter_app

      # ============================================
      # 🧹 Cleanup google-services.json
      # ============================================
      - name: Cleanup google-services.json
        if: always()
        run: |
          echo "🧹 Cleaning up google-services.json files..."
          rm -f android/app/google-services.json
          rm -f android/app/src/main/google-services.json
          echo "✅ Done"
        working-directory: pwa_to_flutter_app

      # ============================================
      # ✅ ملخص البناء
      # ============================================
      - name: Build Summary
        if: always()
        run: |
          echo "========================================="
          echo "📊 BUILD SUMMARY"
          echo "========================================="
          echo ""
          echo "📁 APK:"
          if [ -f build/app/outputs/flutter-apk/app-release.apk ]; then
            SIZE=$(du -h build/app/outputs/flutter-apk/app-release.apk | cut -f1)
            echo "  ✅ app-release.apk ($SIZE)"
          else
            echo "  ❌ app-release.apk (not found)"
          fi
          echo ""
          echo "========================================="
        working-directory: pwa_to_flutter_app
